# 把 web/ 里的介绍页发布到 GitHub Pages。
# 自定义域名 starmate.xmyun.org 在仓库 Settings → Pages 里设置；用 Actions 发布时不需要 CNAME 文件。
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 网站只需要页面和 assets，生成脚本和说明不发布
      - name: Collect site files
        run: |
          cp -r web _site
          rm -rf _site/tools _site/README.md

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
